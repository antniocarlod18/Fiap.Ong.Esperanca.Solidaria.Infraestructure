apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-default-user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-default-pass
                  
          volumeMounts:
            - name: rabbitmq-lib
              mountPath: /var/lib/rabbitmq

            - name: rabbitmq-log
              mountPath: /var/log/rabbitmq

            - name: rabbitmq-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins

      volumes:
        - name: rabbitmq-lib
          persistentVolumeClaim:
            claimName: rabbitmq-lib-pvc

        - name: rabbitmq-log
          persistentVolumeClaim:
            claimName: rabbitmq-log-pvc

        - name: rabbitmq-plugins
          configMap:
            name: rabbitmq-plugins
